<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Return Fire: Redux Map Editor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; color: #ddd; font: 14px system-ui, sans-serif; }
      #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; }
      html, body { background: #0e110d; }
      #status { color: #a39f8f; font: 15px system-ui, -apple-system, sans-serif; }
      #desktop-only { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: #0e110d;
        font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #a39f8f; }
      #desktop-only[hidden] { display: none; }
      #desktop-only .card { max-width: 26em; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 26px; text-align: center;
        background: rgba(16, 19, 15, .9); border: 1px solid rgba(255, 255, 255, .14); border-radius: 16px; box-shadow: 0 18px 50px rgba(0, 0, 0, .6); }
      #desktop-only .icon { font-size: 40px; line-height: 1; }
      #desktop-only b { color: #e3a33b; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; }
      #desktop-only p { margin: 0; }
      @media (max-height: 520px) {
        #desktop-only { align-items: start; overflow: auto; padding: 12px; }
        #desktop-only .card { gap: 8px; padding: 16px 20px; }
        #desktop-only .icon { font-size: 28px; }
      }
      #desktop-only a { margin-top: 6px; padding: 10px 20px; border-radius: 10px; background: #e3a33b; color: #1d1406; font-weight: 700; text-decoration: none; }
      #error { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; background: #111; color: #ddd; }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <div id="error"></div>
    <div id="desktop-only" hidden>
      <div class="card">
        <div class="icon" aria-hidden="true">🖥️</div>
        <b>Desktop only</b>
        <p>The map editor works only in a desktop browser, with a mouse and a keyboard. It is not available on phones or tablets.</p>
        <p>Open this page on a computer to make maps. Maps you share there can be played here.</p>
        <a href="./">Back to the game</a>
      </div>
    </div>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
