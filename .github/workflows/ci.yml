name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Fails the build on any known advisory in the npm dependency tree, so alerts cannot pile up unseen
      # (tools/audit.mjs lists the rare exemption: no fixed release yet, and it never ships).
      - run: npm run audit

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t rf-redux .
      # Both compose files must stay valid; the release attaches docker-compose.images.yml.
      - run: docker compose -f docker-compose.yml config -q && docker compose -f docker-compose.images.yml config -q
        env:
          RF_OWNER_NAME: ci
          RF_OWNER_EMAIL: ci@example.com
          RF_OWNER_PASSWORD: ci-password
