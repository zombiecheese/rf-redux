name: Wiki

# Publishes the pages in wiki/ to the repository's wiki. The wiki must exist first: turn Wikis on in the repository's
# settings and save one page on the Wiki tab (this workflow then replaces it).

on:
  push:
    branches: [main]
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish the pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          if ! git clone --depth 1 "$remote" published; then
            echo "::error::The wiki does not exist yet. Open the repository's Wiki tab, save a first page, then run this workflow again."
            exit 1
          fi
          # The wiki holds exactly what wiki/ holds: pages removed there are removed here.
          find published -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r wiki/. published/
          cd published
          git add -A
          if git diff --cached --quiet; then echo "The wiki is already up to date."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish the wiki from ${GITHUB_SHA::7}"
          git push
